# Shared by ALL arms. Only `arm` and `seed` may differ between runs.
model: Qwen/Qwen2.5-1.5B-Instruct
max_seq_len: 1024

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_targets: [q_proj, k_proj, v_proj, o_proj]

max_steps: 500        # FIXED across arms -- never use epochs
batch_size: 2
grad_accum: 8
lr: 2.0e-4
scheduler: cosine
warmup_ratio: 0.03

seeds: [0, 1, 2]
budgets_tokens: [250000, 500000, 1000000, 2500000]
